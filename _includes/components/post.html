{% assign post = include.post %}

<article id="post{{ post.id | replace:'/','-' }}" class="page post" role="article">
  <div style="margin:0 0 3.5rem 0;">
    {% if post.image %}
      {% assign img_src = post.image.path | default:post.image %}
      <a href="{{ post.url | relative_url }}" class="no-hover" tabindex="-1">
        <img src="{{ img_src | relative_url }}" alt="{{ post.title }}" loading="lazy"
             style="width:100%; max-width:560px; height:auto; border-radius:10px; display:block; box-shadow:0 2px 10px rgba(0,0,0,.18); margin-bottom:.9rem;" />
      </a>
    {% endif %}
    {% assign hook_text = post.hook | default:post.description %}
    {% if hook_text %}
      <p class="faded" style="margin:0 0 .35rem 0; font-size:1rem; line-height:1.6; max-width:560px;">{{ hook_text | markdownify | strip_html }}</p>
    {% endif %}
    <a href="{{ post.url | relative_url }}" class="heading flip-title" style="font-size:1.05rem;">{{ post.title }}</a>
  </div>
</article>
